<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bükmrk</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%93%99%3C/text%3E%3C/svg%3E"
    />
    <style>
        /* Custom styles for Inter font */
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Hide scrollbar for aesthetic purposes */
        ::-webkit-scrollbar {
            display: none;
        }
        body {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body class="min-h-screen bg-gray-100 font-sans antialiased text-gray-900 flex flex-col items-center p-4 sm:p-6">
    <header class="w-full max-w-xl text-center mb-8">
        <h1 class="text-4xl sm:text-5xl font-extrabold text-blue-700 leading-tight">
            Bükmrk
        </h1>
        <p class="text-lg sm:text-xl text-gray-600 mt-2">Track your books, plan your pace.</p>
    </header>

    <main id="app-main-content" class="w-full max-w-xl">
        <!-- Content will be rendered here by JavaScript -->
    </main>

    <!-- Modals (hidden by default) -->
    <div id="add-edit-book-modal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-75 flex items-center justify-center p-4 z-40">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md">
            <h2 id="book-form-title" class="text-2xl font-bold text-gray-800 mb-4">Add New Book</h2>
            <form id="book-form" class="space-y-4">
                <div>
                    <label for="book-title" class="block text-sm font-medium text-gray-700">Title</label>
                    <input type="text" id="book-title" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" required>
                    <p id="error-book-title" class="text-red-500 text-xs mt-1 hidden"></p>
                </div>
                <div>
                    <label for="book-total-pages" class="block text-sm font-medium text-gray-700">Total Pages</label>
                    <input type="number" id="book-total-pages" class="mt-1 block w-full sm:max-w-xs px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" min="1" required>
                    <p id="error-book-total-pages" class="text-red-500 text-xs mt-1 hidden"></p>
                </div>
                <div>
                    <label for="book-due-date" class="block text-sm font-medium text-gray-700">Finish By Date</label>
                    <input type="date" id="book-due-date" class="mt-1 block w-full sm:max-w-xs px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" required>
                    <p id="error-book-due-date" class="text-red-500 text-xs mt-1 hidden"></p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Reading Days</label>
                    <div id="reading-days-checkboxes" class="mt-2 grid grid-cols-4 sm:grid-cols-7 gap-2">
                        <!-- Checkboxes generated by JS -->
                    </div>
                </div>
                <div class="flex justify-end space-x-3 mt-6">
                    <button type="button" id="cancel-book-form" class="px-4 py-2 bg-gray-300 text-gray-800 rounded-md hover:bg-gray-400 transition-colors duration-200 shadow-md">Cancel</button>
                    <button type="submit" id="save-book-form" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors duration-200 shadow-md">Add Book</button>
                </div>
            </form>
        </div>
    </div>

    <div id="log-progress-modal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-75 flex items-center justify-center p-4 z-40">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md">
            <h2 id="log-form-title" class="text-2xl font-bold text-gray-800 mb-4">Log Progress</h2>
            <form id="log-progress-form" class="space-y-4">
                <div>
                    <label for="stopped-page" class="block text-sm font-medium text-gray-700">Stopped on Page</label>
                    <input type="number" id="stopped-page" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" required>
                    <p id="error-stopped-page" class="text-red-500 text-xs mt-1 hidden"></p>
                </div>
                <div>
                    <label for="session-notes" class="block text-sm font-medium text-gray-700">Notes/Summary</label>
                    <textarea id="session-notes" rows="4" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" placeholder="Add your thoughts here..."></textarea>
                    <div id="note-prompts" class="mt-2 text-xs text-gray-500 flex flex-wrap gap-2">
                        <!-- Prompts generated by JS -->
                    </div>
                </div>
                <div class="flex justify-end space-x-3 mt-6">
                    <button type="button" id="cancel-log-form" class="px-4 py-2 bg-gray-300 text-gray-800 rounded-md hover:bg-gray-400 transition-colors duration-200 shadow-md">Cancel</button>
                    <button type="submit" id="save-log-form" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors duration-200 shadow-md">Log Progress</button>
                </div>
            </form>
        </div>
    </div>

    <div id="confirmation-modal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-75 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-sm text-center">
            <p id="confirmation-message" class="text-lg text-gray-800 mb-6">Are you sure?</p>
            <div class="flex justify-center space-x-4">
                <button type="button" id="confirm-cancel" class="px-5 py-2 bg-gray-300 text-gray-800 rounded-md hover:bg-gray-400 transition-colors shadow-md">Cancel</button>
                <button type="button" id="confirm-ok" class="px-5 py-2 bg-red-600 text-white rounded-md hover:bg-red-700 transition-colors shadow-md">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        // --- Global State ---
        let books = [];
        let currentBookId = null; // Used to track which book is being viewed in detail
        let currentSessionToEdit = null; // Used when editing an existing session
        let currentConfirmationAction = null; // Stores function to run on confirmation

        // --- DOM Elements ---
        const appMainContent = document.getElementById('app-main-content');
        const addBookModal = document.getElementById('add-edit-book-modal');
        const bookFormTitle = document.getElementById('book-form-title');
        const bookForm = document.getElementById('book-form');
        const bookTitleInput = document.getElementById('book-title');
        const bookTotalPagesInput = document.getElementById('book-total-pages');
        const bookDueDateInput = document.getElementById('book-due-date');
        const readingDaysCheckboxes = document.getElementById('reading-days-checkboxes');
        const cancelBookFormBtn = document.getElementById('cancel-book-form');
        const saveBookFormBtn = document.getElementById('save-book-form');

        const logProgressModal = document.getElementById('log-progress-modal');
        const logFormTitle = document.getElementById('log-form-title');
        const logProgressForm = document.getElementById('log-progress-form');
        const stoppedPageInput = document.getElementById('stopped-page');
        const sessionNotesInput = document.getElementById('session-notes');
        const notePromptsContainer = document.getElementById('note-prompts');
        const cancelLogFormBtn = document.getElementById('cancel-log-form');
        const saveLogFormBtn = document.getElementById('save-log-form');

        const confirmationModal = document.getElementById('confirmation-modal');
        const confirmationMessage = document.getElementById('confirmation-message');
        const confirmCancelBtn = document.getElementById('confirm-cancel');
        const confirmOkBtn = document.getElementById('confirm-ok');

        // Error message elements
        const errorBookTitle = document.getElementById('error-book-title');
        const errorBookTotalPages = document.getElementById('error-book-total-pages');
        const errorBookDueDate = document.getElementById('error-book-due-date');
        const errorStoppedPage = document.getElementById('error-stopped-page');


        // --- Utility Functions ---
        const getToday = () => {
            const today = new Date();
            return today.toISOString().split('T')[0];
        };

        const getDayOfWeek = (dateString) => {
            const date = new Date(dateString);
            return date.getDay(); // 0 for Sunday, 1 for Monday, etc.
        };

        const calculateDailyTargets = (book) => {
            const { totalPages, currentPage, startDate, dueDate, readingDays } = book;

            const remainingPages = Math.max(0, totalPages - currentPage);

            const start = new Date(startDate);
            const end = new Date(dueDate);

            const eligibleReadingDaysDates = [];
            let currentDate = new Date(start);

            while (currentDate <= end) {
                const dayOfWeek = currentDate.getDay();
                if (readingDays[dayOfWeek]) {
                    eligibleReadingDaysDates.push(currentDate.toISOString().split('T')[0]);
                }
                currentDate.setDate(currentDate.getDate() + 1);
            }

            const nDays = eligibleReadingDaysDates.length;
            const targets = {};

            if (remainingPages === 0) {
                return { targets, message: 'Book completed!', nDaysEligible: nDays };
            }

            if (nDays === 0) {
                return { targets, message: 'No eligible reading days before due date. Adjust plan!', nDaysEligible: nDays };
            }

            const base = Math.floor(remainingPages / nDays);
            let remainder = remainingPages % nDays;

            for (let i = 0; i < nDays; i++) {
                const date = eligibleReadingDaysDates[i];
                targets[date] = base + (remainder > 0 ? 1 : 0);
                if (remainder > 0) {
                    remainder--;
                }
            }

            const todayTarget = targets[getToday()] || 0;
            return { targets, todayTarget, message: '', nDaysEligible: nDays };
        };

        const daysOfWeekNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

        const daysRemaining = (dueDate) => {
            const today = new Date(getToday());
            const due = new Date(dueDate);
            const diffTime = due.getTime() - today.getTime();
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            return diffDays >= 0 ? diffDays : 0;
        };

        const showValidationMessage = (element, message, isHidden) => {
            element.textContent = message;
            if (isHidden) {
                element.classList.add('hidden');
            } else {
                element.classList.remove('hidden');
            }
        };

        // --- Data Management (LocalStorage) ---
        const loadBooks = () => {
            try {
                const storedBooks = localStorage.getItem('myReadingPlanBooks');
                if (storedBooks) {
                    books = JSON.parse(storedBooks).map(book => ({
                        ...book,
                        sessions: book.sessions || [],
                        status: book.status || (book.currentPage === book.totalPages ? 'completed' : 'active')
                    }));
                } else {
                    books = [];
                }
            } catch (error) {
                console.error("Failed to load books from localStorage:", error);
                books = []; // Reset if data is corrupt
            }
        };

        const saveBooks = () => {
            try {
                localStorage.setItem('myReadingPlanBooks', JSON.stringify(books));
            } catch (error) {
                console.error("Failed to save books to localStorage:", error);
            }
        };

        // --- UI Rendering Functions ---

        const renderHomePage = () => {
            appMainContent.innerHTML = ''; // Clear previous content

            const addButtonHtml = `
                <button id="add-new-book-btn" class="w-full px-6 py-3 bg-blue-600 text-white font-semibold rounded-md shadow-lg hover:bg-blue-700 transition-transform transform hover:scale-105 mb-4">
                    Add New Book
                </button>
            `;
            appMainContent.insertAdjacentHTML('beforeend', addButtonHtml);
            document.getElementById('add-new-book-btn').addEventListener('click', () => openBookForm());

            if (books.length === 0) {
                const emptyStateHtml = `
                    <div class="bg-white rounded-lg shadow-md p-6 text-center border-2 border-dashed border-gray-300">
                        <p class="text-lg text-gray-600 mb-4">No books yet. Add your first book to get a simple daily plan.</p>
                        <button id="add-first-book-btn" class="px-6 py-3 bg-blue-600 text-white font-semibold rounded-md shadow-lg hover:bg-blue-700 transition-transform transform hover:scale-105">
                            Add New Book
                        </button>
                    </div>
                `;
                appMainContent.insertAdjacentHTML('beforeend', emptyStateHtml);
                document.getElementById('add-first-book-btn').addEventListener('click', () => openBookForm());
            } else {
                const booksListContainer = document.createElement('div');
                booksListContainer.className = 'space-y-4';

                books.forEach(book => {
                    const { todayTarget, message, nDaysEligible } = calculateDailyTargets(book);
                    const progressPercentage = (book.currentPage / book.totalPages) * 100;
                    const daysLeft = daysRemaining(book.dueDate);

                    const bookCard = document.createElement('div');
                    bookCard.className = 'bg-white rounded-lg shadow-md p-5 border border-gray-200 cursor-pointer hover:shadow-lg transition-shadow';
                    bookCard.dataset.bookId = book.id; // Store book ID for click event

                    let statusContent = '';
                    if (book.status === 'completed') {
                        statusContent = `<p class="text-green-600 font-semibold text-base mt-2">🎉 Book Completed!</p>`;
                    } else {
                        statusContent = message ?
                            `<p class="text-red-500 text-sm italic mt-2">${message}</p>` :
                            `<p class="text-lg font-semibold text-gray-700 mt-2">Today's Target: <span class="text-blue-600">${todayTarget} pages</span></p>`;
                        statusContent += `<p class="text-sm text-gray-600 mt-1">Eligible Reading Days: <span class="font-semibold">${nDaysEligible}</span></p>`;
                    }

                    bookCard.innerHTML = `
                        <h3 class="text-xl font-bold text-gray-800 mb-2">${book.title}</h3>
                        <div class="text-sm text-gray-600 mb-3 flex justify-between items-center">
                            <span>Page ${book.currentPage} / ${book.totalPages}</span>
                            <span>Due: ${book.dueDate} (${daysLeft} days left)</span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-2.5 mb-3">
                            <div class="bg-blue-500 h-2.5 rounded-full" style="width: ${progressPercentage}%;"></div>
                        </div>
                        ${statusContent}
                    `;
                    bookCard.addEventListener('click', () => renderBookDetail(book.id));
                    booksListContainer.appendChild(bookCard);
                });
                appMainContent.appendChild(booksListContainer);
            }
        };

        const renderBookDetail = (bookId) => {
            currentBookId = bookId;
            const book = books.find(b => b.id === bookId);
            if (!book) {
                renderHomePage(); // Go back if book not found (e.g., deleted)
                return;
            }

            const { todayTarget, message, nDaysEligible } = calculateDailyTargets(book);
            const progressPercentage = (book.currentPage / book.totalPages) * 100;
            const daysLeft = daysRemaining(book.dueDate);

            appMainContent.innerHTML = `
                <!-- Header -->
                <div class="bg-white shadow-md p-4 sm:p-6 flex items-center justify-between rounded-t-lg">
                    <button id="back-to-books-btn" class="text-blue-600 hover:text-blue-800 text-lg">
                        &lt; Back to Books
                    </button>
                    <h2 class="text-2xl sm:text-3xl font-bold text-gray-800 truncate flex-grow text-center mx-4">${book.title}</h2>
                    <div class="w-24"></div>
                </div>

                <!-- Book Summary -->
                <div class="p-4 sm:p-6 bg-white border-b border-gray-200">
                    <div class="flex justify-between items-center text-gray-700 text-base mb-2">
                        <span>Page ${book.currentPage} / ${book.totalPages}</span>
                        <span>Due: ${book.dueDate} (${daysLeft} days left)</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-3 mb-4">
                        <div class="bg-blue-500 h-3 rounded-full" style="width: ${progressPercentage}%;"></div>
                    </div>
                    ${book.status === 'completed' ? `
                        <p class="text-green-600 font-semibold text-lg text-center mt-2">🎉 Book Completed!</p>
                    ` : `
                        ${message ? `
                            <p class="text-red-500 text-base italic text-center mt-2">${message}</p>
                        ` : `
                            <p class="text-xl font-semibold text-gray-700 text-center mt-2">
                                Today's Target: <span class="text-blue-600">${todayTarget} pages</span>
                            </p>
                        `}
                        <p class="text-sm text-gray-600 text-center mt-1">
                            Eligible Reading Days: <span class="font-semibold">${nDaysEligible}</span>
                        </p>
                        <div class="flex justify-center mt-4 space-x-3">
                            <button id="log-reading-btn" class="px-5 py-2 bg-green-500 text-white font-semibold rounded-md hover:bg-green-600 transition-colors shadow-md">
                                Log Reading
                            </button>
                            <button id="edit-plan-btn" class="px-5 py-2 bg-purple-500 text-white font-semibold rounded-md hover:bg-purple-600 transition-colors shadow-md">
                                Edit Plan
                            </button>
                        </div>
                    `}
                </div>

                <!-- Tabs -->
                <div class="bg-white border-b border-gray-200 px-4 sm:px-6 flex justify-around">
                    <button id="tab-sessions" class="py-3 px-2 text-lg font-medium border-b-2 border-blue-600 text-blue-600">
                        Sessions
                    </button>
                    <button id="tab-settings" class="py-3 px-2 text-lg font-medium text-gray-600 hover:text-gray-800">
                        Settings
                    </button>
                </div>

                <!-- Tab Content -->
                <div id="tab-content" class="flex-grow overflow-y-auto p-4 sm:p-6 bg-gray-100 rounded-b-lg">
                    <!-- Content for selected tab will go here -->
                </div>
            `;

            document.getElementById('back-to-books-btn').addEventListener('click', () => {
                currentBookId = null;
                renderHomePage();
            });

            if (book.status !== 'completed') {
                document.getElementById('log-reading-btn').addEventListener('click', () => openLogProgressForm(book));
                document.getElementById('edit-plan-btn').addEventListener('click', () => openBookForm(book));
            }


            const tabSessionsBtn = document.getElementById('tab-sessions');
            const tabSettingsBtn = document.getElementById('tab-settings');
            const tabContentDiv = document.getElementById('tab-content');

            const activateTab = (tabName) => {
                tabSessionsBtn.classList.remove('border-blue-600', 'text-blue-600');
                tabSettingsBtn.classList.remove('border-blue-600', 'text-blue-600');
                tabSessionsBtn.classList.add('text-gray-600', 'hover:text-gray-800');
                tabSettingsBtn.classList.add('text-gray-600', 'hover:text-gray-800');

                if (tabName === 'sessions') {
                    tabSessionsBtn.classList.add('border-blue-600', 'text-blue-600');
                    tabSessionsBtn.classList.remove('text-gray-600', 'hover:text-gray-800');
                    renderSessionsTab(book, tabContentDiv);
                } else if (tabName === 'settings') {
                    tabSettingsBtn.classList.add('border-blue-600', 'text-blue-600');
                    tabSettingsBtn.classList.remove('text-gray-600', 'hover:text-gray-800');
                    renderSettingsTab(book, tabContentDiv);
                }
            };

            tabSessionsBtn.addEventListener('click', () => activateTab('sessions'));
            tabSettingsBtn.addEventListener('click', () => activateTab('settings'));

            // Initial tab render
            activateTab('sessions');
        };

        const renderSessionsTab = (book, container) => {
            container.innerHTML = '';
            if (book.sessions && book.sessions.length > 0) {
                const sortedSessions = [...book.sessions].sort((a, b) => new Date(b.date) - new Date(a.date));
                sortedSessions.forEach(session => {
                    const sessionDiv = document.createElement('div');
                    sessionDiv.className = 'bg-white rounded-lg shadow-sm p-4 border border-gray-200';
                    sessionDiv.innerHTML = `
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-sm font-semibold text-gray-700">${session.date}</span>
                            <div class="space-x-2">
                                <button data-session-id="${session.id}" class="edit-session-btn text-blue-500 hover:text-blue-700 text-sm">
                                    Edit
                                </button>
                                <button data-session-id="${session.id}" class="delete-session-btn text-red-500 hover:text-red-700 text-sm">
                                    Delete
                                </button>
                            </div>
                        </div>
                        <p class="text-gray-800 text-base mb-2">
                            Read <span class="font-semibold">${session.pagesRead} pages</span> (from page ${session.startPage} to ${session.endPage})
                        </p>
                        ${session.notes ? `<p class="text-sm text-gray-600 italic border-t pt-2 mt-2">${session.notes}</p>` : ''}
                    `;
                    container.appendChild(sessionDiv);
                });

                container.querySelectorAll('.edit-session-btn').forEach(button => {
                    button.addEventListener('click', (e) => {
                        const sessionId = e.target.dataset.sessionId;
                        const session = book.sessions.find(s => s.id === sessionId);
                        openLogProgressForm(book, session);
                    });
                });
                container.querySelectorAll('.delete-session-btn').forEach(button => {
                    button.addEventListener('click', (e) => {
                        const sessionId = e.target.dataset.sessionId;
                        showConfirmation(
                            "Are you sure you want to delete this reading session? This cannot be undone and will affect your book's current page.",
                            () => handleDeleteSessionConfirmed(sessionId)
                        );
                    });
                });
            } else {
                container.innerHTML = `<p class="text-gray-600 text-center py-8">No reading sessions logged yet.</p>`;
            }
        };

        const renderSettingsTab = (book, container) => {
            container.innerHTML = `
                <div class="space-y-6 bg-white rounded-lg shadow-md p-6">
                    <h3 class="text-xl font-bold text-gray-800 mb-4">Book Settings</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Reading Days:</label>
                            <div class="mt-1 flex flex-wrap gap-2">
                                ${daysOfWeekNames.map((day, index) => book.readingDays[index] ?
                                    `<span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">${day}</span>` : ''
                                ).join('')}
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Start Date:</label>
                            <p class="mt-1 text-gray-900">${book.startDate}</p>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Due Date:</label>
                            <p class="mt-1 text-gray-900">${book.dueDate}</p>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Total Pages:</label>
                            <p class="mt-1 text-gray-900">${book.totalPages}</p>
                        </div>
                    </div>

                    <div class="flex flex-col sm:flex-row justify-center space-y-3 sm:space-y-0 sm:space-x-4 mt-6">
                        <button id="edit-book-details-btn" class="px-5 py-2 bg-purple-600 text-white font-semibold rounded-md hover:bg-purple-700 transition-colors shadow-md">
                            Edit Book Details
                        </button>
                        <div class="relative inline-block text-left">
                            <button id="export-notes-btn" class="px-5 py-2 bg-gray-600 text-white font-semibold rounded-md hover:bg-gray-700 transition-colors shadow-md">
                                Export Notes
                            </button>
                            <div id="export-menu" class="origin-top-right absolute right-0 mt-2 w-40 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 hidden z-10">
                                <div class="py-1" role="menu" aria-orientation="vertical" aria-labelledby="options-menu">
                                    <button id="export-md-btn" class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 hover:text-gray-900" role="menuitem">
                                        Export as Markdown (.md)
                                    </button>
                                    <button id="export-txt-btn" class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 hover:text-gray-900" role="menuitem">
                                        Export as Plain Text (.txt)
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    ${book.status !== 'completed' ? `
                        <button id="mark-complete-btn" class="w-full mt-6 px-5 py-2 bg-green-700 text-white font-semibold rounded-md hover:bg-green-800 transition-colors shadow-md">
                            Mark Book as Complete
                        </button>
                    ` : ''}
                    <button id="delete-book-btn" class="w-full mt-6 px-5 py-2 bg-red-600 text-white font-semibold rounded-md hover:bg-red-700 transition-colors shadow-md">
                        Delete Book
                    </button>
                </div>
            `;
            // Add event listeners for buttons in settings tab
            document.getElementById('edit-book-details-btn').addEventListener('click', () => openBookForm(book));
            document.getElementById('export-notes-btn').addEventListener('click', () => document.getElementById('export-menu').classList.toggle('hidden'));
            document.getElementById('export-md-btn').addEventListener('click', () => { exportBookNotes(book, 'md'); document.getElementById('export-menu').classList.add('hidden'); });
            document.getElementById('export-txt-btn').addEventListener('click', () => { exportBookNotes(book, 'txt'); document.getElementById('export-menu').classList.add('hidden'); });
            if (book.status !== 'completed') {
                document.getElementById('mark-complete-btn').addEventListener('click', () => handleMarkBookComplete(book.id));
            }
            document.getElementById('delete-book-btn').addEventListener('click', () => showConfirmation(
                `Are you sure you want to delete "${book.title}"? This cannot be undone and all associated reading data will be lost.`,
                () => handleDeleteBookConfirmed(book.id)
            ));
        };

        // --- Modal Control Functions ---
        const openBookForm = (book = null) => {
            currentBookId = book ? book.id : null; // Set current book if editing
            bookFormTitle.textContent = book ? 'Edit Book' : 'Add New Book';
            bookTitleInput.value = book ? book.title : '';
            bookTotalPagesInput.value = book ? book.totalPages : '';
            bookDueDateInput.value = book ? book.dueDate : getToday();
            bookDueDateInput.min = getToday(); // Ensure due date cannot be in the past

            // Clear previous errors
            showValidationMessage(errorBookTitle, '', true);
            showValidationMessage(errorBookTotalPages, '', true);
            showValidationMessage(errorBookDueDate, '', true);

            // Populate reading days checkboxes
            readingDaysCheckboxes.innerHTML = '';
            const initialReadingDays = book ? book.readingDays : new Array(7).fill(true);
            initialReadingDays.forEach((isChecked, index) => {
                const button = document.createElement('button');
                button.type = 'button';
                button.dataset.index = index;
                button.textContent = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][index];
                button.className = `px-3 py-2 rounded-md text-sm font-medium transition-colors duration-200 ${isChecked ? 'bg-blue-600 text-white shadow-md' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`;
                button.addEventListener('click', (e) => {
                    initialReadingDays[index] = !initialReadingDays[index];
                    e.target.className = `px-3 py-2 rounded-md text-sm font-medium transition-colors duration-200 ${initialReadingDays[index] ? 'bg-blue-600 text-white shadow-md' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`;
                });
                readingDaysCheckboxes.appendChild(button);
            });
            bookForm.currentReadingDays = initialReadingDays; // Store for form submission

            saveBookFormBtn.textContent = book ? 'Save Changes' : 'Add Book';
            addBookModal.classList.remove('hidden');
        };

        const closeBookForm = () => {
            addBookModal.classList.add('hidden');
            // Re-render book detail if we were editing
            if (currentBookId) {
                renderBookDetail(currentBookId);
            } else {
                renderHomePage(); // Go back to home if adding a new book
            }
        };

        const openLogProgressForm = (book, session = null) => {
            currentBookId = book.id; // Ensure we know which book this session belongs to
            currentSessionToEdit = session;
            logFormTitle.textContent = session ? 'Edit Reading Session' : `Log Progress for "${book.title}"`;
            stoppedPageInput.value = session ? session.endPage : book.currentPage;
            sessionNotesInput.value = session ? session.notes : '';
            stoppedPageInput.min = session ? 1 : book.currentPage + 1;
            stoppedPageInput.max = book.totalPages;

            showValidationMessage(errorStoppedPage, '', true);

            // Populate note prompts
            notePromptsContainer.innerHTML = '';
            const notePrompts = [
                'What stood out to me and why?',
                'One idea I want to remember later',
                'How would I explain this in two sentences?',
                'A quote worth saving (with page #)',
                'A question I still have',
                'How does this connect to what I already know?',
            ];
            notePrompts.forEach((prompt, index) => {
                const span = document.createElement('span');
                span.className = 'inline-block bg-gray-100 rounded-full px-3 py-1 cursor-pointer hover:bg-gray-200 transition-colors';
                span.textContent = prompt;
                span.addEventListener('click', () => {
                    sessionNotesInput.value += (sessionNotesInput.value ? '\n\n' : '') + prompt;
                });
                notePromptsContainer.appendChild(span);
            });

            saveLogFormBtn.textContent = session ? 'Save Changes' : 'Log Progress';
            logProgressModal.classList.remove('hidden');
        };

        const closeLogProgressForm = () => {
            logProgressModal.classList.add('hidden');
            renderBookDetail(currentBookId); // Always return to book detail after logging/editing session
        };

        const showConfirmation = (message, onConfirmCallback) => {
            confirmationMessage.textContent = message;
            currentConfirmationAction = onConfirmCallback;
            confirmationModal.classList.remove('hidden');
        };

        const hideConfirmation = () => {
            confirmationModal.classList.add('hidden');
            currentConfirmationAction = null;
        };

        // --- Event Handlers ---
        bookForm.addEventListener('submit', (e) => {
            e.preventDefault();
            let isValid = true;

            // Validate Title
            if (!bookTitleInput.value.trim()) {
                showValidationMessage(errorBookTitle, 'Title is required.', false);
                isValid = false;
            } else {
                showValidationMessage(errorBookTitle, '', true);
            }

            // Validate Total Pages
            const totalPages = parseInt(bookTotalPagesInput.value);
            if (isNaN(totalPages) || totalPages <= 0) {
                showValidationMessage(errorBookTotalPages, 'Total pages must be a positive number.', false);
                isValid = false;
            } else {
                showValidationMessage(errorBookTotalPages, '', true);
            }

            // Validate Due Date
            const dueDate = bookDueDateInput.value;
            if (new Date(dueDate) < new Date(getToday())) {
                showValidationMessage(errorBookDueDate, 'Due date must be today or later.', false);
                isValid = false;
            } else {
                showValidationMessage(errorBookDueDate, '', true);
            }

            if (!isValid) return;

            const existingBookIndex = books.findIndex(b => b.id === currentBookId);

            if (existingBookIndex !== -1) {
                // Editing existing book
                const updatedBook = {
                    ...books[existingBookIndex],
                    title: bookTitleInput.value.trim(),
                    totalPages: totalPages,
                    dueDate: dueDate,
                    readingDays: bookForm.currentReadingDays,
                };
                books[existingBookIndex] = updatedBook;
            } else {
                // Adding new book
                const newBook = {
                    id: Date.now().toString(),
                    title: bookTitleInput.value.trim(),
                    totalPages: totalPages,
                    currentPage: 0,
                    startDate: getToday(),
                    dueDate: dueDate,
                    readingDays: bookForm.currentReadingDays,
                    status: 'active',
                    sessions: [],
                };
                books.push(newBook);
            }
            saveBooks();
            closeBookForm();
        });

        cancelBookFormBtn.addEventListener('click', closeBookForm);


        logProgressForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const book = books.find(b => b.id === currentBookId);
            if (!book) return;

            const newStoppedPage = parseInt(stoppedPageInput.value);
            const notes = sessionNotesInput.value.trim();
            let isValid = true;

            if (isNaN(newStoppedPage)) {
                showValidationMessage(errorStoppedPage, 'Please enter a valid page number.', false);
                isValid = false;
            } else if (!currentSessionToEdit && (newStoppedPage <= book.currentPage || newStoppedPage > book.totalPages)) {
                showValidationMessage(errorStoppedPage, `Stopped page must be between ${book.currentPage + 1} and ${book.totalPages}.`, false);
                isValid = false;
            } else if (currentSessionToEdit && (newStoppedPage <= 0 || newStoppedPage > book.totalPages)) {
                 showValidationMessage(errorStoppedPage, `Stopped page must be between 1 and ${book.totalPages}.`, false);
                 isValid = false;
            } else {
                showValidationMessage(errorStoppedPage, '', true);
            }

            if (!isValid) return;

            let updatedSessions;
            let recalculatedCurrentPage;

            if (currentSessionToEdit) {
                // Editing existing session
                const oldSession = book.sessions.find(s => s.id === currentSessionToEdit.id);
                const oldStartPage = oldSession.startPage;
                const pagesRead = newStoppedPage - oldStartPage;

                updatedSessions = book.sessions.map(s =>
                    s.id === currentSessionToEdit.id ? { ...s, endPage: newStoppedPage, pagesRead: pagesRead, notes } : s
                );
            } else {
                // Adding new session
                const pagesRead = newStoppedPage - book.currentPage;
                updatedSessions = [...book.sessions, {
                    id: Date.now().toString(),
                    date: getToday(),
                    startPage: book.currentPage,
                    endPage: newStoppedPage,
                    pagesRead: pagesRead,
                    notes: notes,
                }];
            }

            recalculatedCurrentPage = updatedSessions.length > 0
                ? Math.max(...updatedSessions.map(s => s.endPage))
                : 0;

            const updatedBookIndex = books.findIndex(b => b.id === book.id);
            if (updatedBookIndex !== -1) {
                books[updatedBookIndex] = {
                    ...book,
                    currentPage: recalculatedCurrentPage,
                    sessions: updatedSessions,
                    status: recalculatedCurrentPage === book.totalPages ? 'completed' : 'active',
                };
            }
            saveBooks();
            closeLogProgressForm();
        });

        cancelLogFormBtn.addEventListener('click', closeLogProgressForm);


        confirmOkBtn.addEventListener('click', () => {
            if (currentConfirmationAction) {
                currentConfirmationAction();
            }
            hideConfirmation();
        });

        confirmCancelBtn.addEventListener('click', hideConfirmation);


        // --- Core Logic for Deletion and Marking Complete ---
        const handleDeleteSessionConfirmed = (sessionId) => {
            const book = books.find(b => b.id === currentBookId);
            if (!book) return;

            const remainingSessions = book.sessions.filter(s => s.id !== sessionId);

            const newCurrentPage = remainingSessions.length > 0
                ? Math.max(...remainingSessions.map(s => s.endPage))
                : 0;

            const updatedBookIndex = books.findIndex(b => b.id === book.id);
            if (updatedBookIndex !== -1) {
                books[updatedBookIndex] = {
                    ...book,
                    currentPage: newCurrentPage,
                    sessions: remainingSessions,
                    status: newCurrentPage === book.totalPages ? 'completed' : 'active',
                };
            }
            saveBooks();
            renderBookDetail(currentBookId); // Re-render detail view to reflect changes
        };

        const handleDeleteBookConfirmed = (bookIdToDelete) => {
            books = books.filter(book => book.id !== bookIdToDelete);
            saveBooks();
            currentBookId = null; // Clear selected book
            renderHomePage(); // Go back to home page
        };

        const handleMarkBookComplete = (bookId) => {
            const bookIndex = books.findIndex(b => b.id === bookId);
            if (bookIndex !== -1) {
                books[bookIndex] = {
                    ...books[bookIndex],
                    currentPage: books[bookIndex].totalPages,
                    status: 'completed'
                };
                saveBooks();
                renderBookDetail(bookId); // Re-render to show completed status
            }
        };

        // --- Export Logic ---
        const exportBookNotes = (book, format) => {
            let content = '';
            const fileName = `${book.title.replace(/[^a-z0-9]/gi, '_')}-notes.${format}`;

            if (format === 'md') {
                content += `# ${book.title}\n\n`;
                content += `## Overview\n`;
                content += `- Total Pages: ${book.totalPages}\n`;
                content += `- Current Page: ${book.currentPage}\n`;
                content += `- Due Date: ${book.dueDate}\n`;
                if (book.status === 'completed') {
                    content += `- Finished On: ${book.sessions.length > 0 ? book.sessions[book.sessions.length - 1].date : 'N/A'}\n`;
                }
                content += '\n';

                if (book.sessions && book.sessions.length > 0) {
                    content += `## Session Notes\n\n`;
                    book.sessions.forEach(session => {
                        content += `### ${session.date} (Pages ${session.startPage} - ${session.endPage}, Read ${session.pagesRead} pages)\n`;
                        if (session.notes) {
                            content += `${session.notes}\n\n`;
                        } else {
                            content += `(No notes for this session)\n\n`;
                        }
                    });
                }

            } else { // plain text
                content += `${book.title}\n\n`;
                content += `--- Overview ---\n`;
                content += `Total Pages: ${book.totalPages}\n`;
                content += `Current Page: ${book.currentPage}\n`;
                content += `Due Date: ${book.dueDate}\n`;
                if (book.status === 'completed') {
                    content += `Finished On: ${book.sessions.length > 0 ? book.sessions[book.sessions.length - 1].date : 'N/A'}\n`;
                }
                content += '\n';

                if (book.sessions && book.sessions.length > 0) {
                    content += `--- Session Notes ---\n\n`;
                    book.sessions.forEach(session => {
                        content += `Date: ${session.date}\n`;
                        content += `Pages: ${session.startPage} - ${session.endPage} (Read ${session.pagesRead} pages)\n`;
                        content += `Notes: ${session.notes || '(No notes)'}\n\n`;
                    });
                }
            }

            const blob = new Blob([content], { type: format === 'md' ? 'text/markdown' : 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        };


        // --- Initial Load ---
        document.addEventListener('DOMContentLoaded', () => {
            loadBooks();
            renderHomePage();
        });
    </script>
</body>
</html>
