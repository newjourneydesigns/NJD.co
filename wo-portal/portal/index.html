<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Walter Ochenski LLC</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#FF5100">
  <link rel="icon" type="image/svg+xml" href="/assets/img/wo-mark.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/wo-favicon-32.png">
  <!-- Home-screen icons are full-bleed and opaque on purpose: the platform masks
       them itself, so a transparent margin lands as a black frame around the art.
       Regenerate with tools/icons/generate.py. -->
  <link rel="apple-touch-icon" href="/assets/img/wo-app-icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="WO Portal">
  <!-- iOS installs whatever URL is on screen, Android installs the manifest's
       start_url; both land on /portal/ here, and scope keeps the installed
       window inside the portal. -->
  <link rel="manifest" href="/portal/site.webmanifest">
  <!-- Self-hosted Inter. Preloaded because the @font-face lives inside
       styles.css, so the browser cannot discover the font until that
       stylesheet has parsed. -->
  <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/inter-latin.woff2" crossorigin>
  <link rel="stylesheet" href="/css/styles.css?v=1">
  <link rel="stylesheet" href="/css/portal.css?v=1">
  <link rel="stylesheet" href="/css/print.css?v=1">
</head>
<body class="login">
  <main class="login" id="main">
    <div class="login__panel" id="login-panel">
      <img src="/assets/img/wo-mark-orange-96.png" alt="Walter Ochenski LLC" width="48" height="48">
      <h1>Portal</h1>
      <p>Clients, invoices and expenses for Walter Ochenski LLC.</p>

      <!-- autocapitalize/autocorrect/spellcheck are off on both fields on
           purpose. A phone keyboard capitalising the first letter of a
           username or a case-sensitive password produces "check your username
           and password" with nothing on screen to explain it, and the person
           retypes the same wrong thing until they give up. -->
      <form id="login-form">
        <div class="form-field">
          <label for="login-username">Username</label>
          <input type="text" id="login-username" name="username" autocomplete="username"
                 autocapitalize="none" autocorrect="off" spellcheck="false"
                 required>
        </div>
        <div class="form-field">
          <label for="login-password">Password</label>
          <div class="password-field">
            <input type="password" id="login-password" name="password" autocomplete="current-password"
                   autocapitalize="none" autocorrect="off" spellcheck="false" required>
            <!-- Typed blind, an assigned password is close to unusable on a
                 phone. The toggle is the difference between one attempt and
                 five. -->
            <button class="password-field__toggle" type="button" id="login-reveal"
                    aria-label="Show password" aria-pressed="false">Show</button>
          </div>
        </div>
        <!-- Ticked by default on purpose: the portal lives on personal phones
             and laptops, and "sign in again every visit" is the surprising
             behaviour, not the safe one. Unticking is for the borrowed or
             shared machine, and it holds only until the browser closes.
             The shape is load-bearing: .form-field is what carries the 16px
             input floor, and the wrapping .check label is what the 44px tap
             floor is measured on. -->
        <div class="form-field">
          <label class="check" for="login-remember">
            <input type="checkbox" id="login-remember" checked>
            Remember me on this device
          </label>
        </div>
        <button class="btn" type="submit" id="login-submit">Sign in</button>
      </form>

      <div id="login-status" aria-live="polite"></div>

      <!-- No reset link and no address: the system sends no email. A lost
           password is a phone call, and the owner sets a new one from
           Admin → People. -->
      <p class="login__foot">Forgotten your password? Call (972) 467-5988.</p>
    </div>
  </main>

  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>

  <!-- The Supabase client, self-hosted rather than pulled from a CDN so the
       portal is up exactly when the rest of the site is. Classic scripts and
       module scripts are both deferred and run in document order, so this has
       already defined window.supabase by the time the module below runs.
       See js/vendor/README.md. -->
  <script src="/js/vendor/supabase-2.111.0.js"></script>
  <script type="module" src="/js/portal/login.js?v=1"></script>
</body>
</html>
